name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://user:password@localhost:5432/codementor_ai
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-placeholder-secret

jobs:
  validate:
    name: Validasi (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test
        env:
          # Cross-env langkah independen; tanpa GROQ_API_KEY test chat lari ke mode demo.
          GROQ_API_KEY: ""

      - name: Build (next build)
        run: npm run build